# Cau hinh chot - xem KE_HOACH_XAY_DUNG_CODE.md muc 9.

data:
  root: /home/buidinhkhoi/Datasets/tartanair-v2
  jepa_root: /home/buidinhkhoi/Datasets/tartanair-v2-jepa
  manifest:
    train: /home/buidinhkhoi/Datasets/tartanair-v2-jepa/train/manifest.csv
    valid: /home/buidinhkhoi/Datasets/tartanair-v2-jepa/valid/manifest.csv
    test:  /home/buidinhkhoi/Datasets/tartanair-v2-jepa/test/manifest.csv
  norm_stats: /home/buidinhkhoi/Thuctap/qwt_jepa/configs/norm_stats.yaml
  image:
    source_size: [640, 640]
    train_crop:  [256, 256]
    eval_crop:   [256, 256]
    qwt_levels:  3
  imu:
    sampling_rate: 100
    window_size:   128            # 1.28 giay
    channels:      6              # [ax, ay, az, gx, gy, gz]
    mode:          causal         # imu_end = frame_idx*10 ; imu_start = imu_end - 128
    qwt_levels:    3
    groups:       [acc, gyro]

  split:
    by: environment
    # Manifest co san cua tartanair-v2-jepa da chia train/valid/test theo trajectory
    # (7 env xuat hien o ca 3 split). Dat enforce_env_split=true de LOC lai theo env
    # dung cac danh sach duoi (chia that su theo environment nhu ke hoach).
    enforce_env_split: false
    train_envs: [AmericanDiner, ArchVizTinyHouseDay, CountryHouse, DesertGasStation]
    val_envs:   [OldTownNight]
    test_envs:  [RetroOffice, WaterMillDay]

corruption:                       # sinh on-the-fly, co seed; KHONG luu ban noisy
  # Profile: DRONE / UAV, camera + IMU 100 Hz. Muc tieu: khu mo + khu nhieu cho robot that.
  # TartanAir la anh SACH nen nhieu chinh la thu tao ra bai toan -> moi hang so trong
  # corruption.py deu duoc BOC NGAU NHIEN theo sample (pha Bayer, pha luoi JPEG, tam
  # vignette, so lan loc mau, co hat chroma, ti le tron rung, so hoa ba, he so spike,
  # buoc ADC) de model khong hoc thuoc mot phep bien doi co dinh roi dao nguoc.
  image:
    condition:     [0.10, 1.0]     # [san, tran] cua bien an 'dieu kien chup'. San 0.10
                                   #   dam bao khong bao gio co dieu kien HOAN HAO -> khong
                                   #   sinh ra cap (sach, gan nhu sach). Dat [0, 1] de tat.
    couple:        0.70            # RANG BUOC do sang <-> do nhoe <-> muc nhieu qua mot
                                   #   bien an 'dieu kien chup'. Camera thieu sang phai chon
                                   #   phoi lau (nhoe) hoac tang ISO (nhieu), va van ra anh
                                   #   toi -> ba thu di CUNG NHAU. 0 = doc lap nhu cu.
    p_blur:        0.85            # de do dai quyet dinh: dieu kien tot -> length ~0 -> net
    blur_kernel:   [0, 13]         # do dai motion blur (px), goc + quy dao ngau nhien
    exposure:      [0.70, 1.10]    # THIEU ANH SANG NHE: da so anh toi di ~10% -> model phai hoc
                                   #   TANG DO SANG, khong chi khu nhieu. Van chua ~12% anh
                                   #   sang hon binh thuong de model phai UOC LUONG muc can
                                   #   bu, thay vi hoc thuoc 'luon nhan len mot he so'.
    p_illum:       0.60            # chieu sang KHONG DEU theo khong gian (den lech phia,
    illum_depth:   [0.10, 0.45]    #   vat che bong) - vung toi nhat bi giam toi muc nay
    p_vignette:    0.7
    vignette:      [0.10, 0.35]    # lens shading; tam quang hoc LECH ngau nhien moi sample
    bayer:         true            # pipeline RAW kieu Unprocessing (CVPR'19); pha CFA
    wb_gains:      [1.2, 2.4]      #   (RGGB/GRBG/GBRG/BGGR) boc ngau nhien tung sample
    shot_noise:    [0.02, 0.10]    # shot noise photon (sinh o mien RAW)
    gauss_std:     [0.005, 0.030]  # read noise mach doc (sinh o mien RAW)
    p_chroma:      0.5
    chroma_noise:  [0.005, 0.016]  # dom mau tan so thap, co hat ngau nhien 8..32 px
    chroma_denoise: [0, 2]         # so lan loc mau cua ISP, boc ngau nhien trong khoang
    p_jpeg:        0.85
    jpeg_q:        [45, 95]        # JPEG THAT; pha luoi 8x8 lech ngau nhien 0..7 px
    severity_skew: 1.5
  imu:
    gauss_std:   [0.02, 0.07]      # white noise (angle/velocity random walk)
    # --- KHONG DEU THEO THOI GIAN: chuoi that co luc yen, co luc nhieu han len ---
    burst_amp:   [1.2, 4.0]        # "con nhieu" nhan them bien do (0 = tat, phang nhu cu)
    burst_max:   3                 # so con toi da trong 1 cua so 1.28 s
    p_step:      0.15              # xac suat co cu NHAY MUC giua cua so
    step:        [0.08, 0.25]      # do lon cu nhay ngay luc vot len
    step_tau:    [8.0, 40.0]       # hang so thoi gian HOI PHUC (so mau; 0.08-0.4 s)
    step_resid:  [0.0, 0.35]       # phan lech con lai VINH VIEN sau khi hoi phuc
    p_stuck:     0.12              # xac suat co doan gia tri bi treo (mat goi tin)
    stuck_len:   [2, 8]            # dai doan treo (so mau)
    p_bias:      0.25              # boc theo TUNG KENH: chi vai truc bi day lech han
    bias:        [0.02, 0.08]      # turn-on bias NHE: nhieu chu yeu DAO DONG quanh duong
                                   #   sach, khong keo ca duong roi khoi no
    p_drift:     0.30
    drift:       [0.03, 0.10]      # bias instability NHE: troi cham, bien do nho
    p_spike:     0.30
    spike_prob:  0.02
    spike_gain:  [3.0, 8.0]        # bien do spike = gain * gauss_std (truoc day co dinh 5.0)
    # --- RUNG: voi DRONE, nguon chinh la rotor NAM TREN Nyquist -> vao du lieu qua aliasing
    p_vibration: 0.70              # rung trong bang: khung may + gimbal + gio giat
    vibration:   [0.05, 0.18]
    vib_freqs:   [12.0, 45.0]
    vib_q:       9.0               # drone cong huong NHON hon robot mat dat
    p_alias:     0.85              # rotor gan nhu LUON co -> xac suat cao
    alias_amp:   [0.05, 0.20]      # va la thanh phan rung TROI NHAT tren drone
    alias_freq:  [70.0, 280.0]     # RPM/60 * so canh; quad 4000-9000 RPM -> 67-300 Hz
    scale_err:   [0.0, 0.02]       # sai so he so khuech dai
    misalign:    [0.0, 0.01]       # lech truc / cross-axis coupling
    vre:         [0.08, 0.25]      # vibration rectification: rung -> lech DC (da giam)
    quant:       [0.001, 0.004]    # buoc luong tu ADC (khac nhau giua cac chip)
    clip:        6.0               # bao hoa toan thang
    severity_skew: 1.5

model:
  d_model: 384
  encoder:   {depth: 12, heads: 6}
  predictor: {d_pred: 192, depth: 4, heads: 6}
  recon_gate: true                # Head xuat HE SO NHAN cho he so nhieu (w*(1+gate)+delta)
                                  #   thay vi chi cong. Khu nhieu wavelet la phep CO he so -
                                  #   mot phep NHAN - ma mot lop Linear khong bieu dien noi.
                                  #   Khoi tao 0 => dau ra bat dau DUNG BANG anh nhieu.
                                  #   Chi co tac dung khi recon_skip.
  recon_skip: true                # Noi HE SO QWT THO (chua qua encoder) vao dau vao
                                  #   recon head. Chi tiet min khong phai song sot qua 12 lop
                                  #   attention toan cuc nua. Nghiem tam thuong tro thanh
                                  #   "copy anh nhieu" (~21.99 dB tren du lieu Kaggle) thay vi
                                  #   phai mo tu 0 - day la SAN moi, cao hon cho model dang
                                  #   dung (~16.6 dB). Chi co tac dung khi recon_from_full.
  recon_from_full: true           # Recon head doc bieu dien cua TOAN BO token (luot rieng,
                                  #   CUNG context_encoder, khong phai model thu hai) thay vi
                                  #   doc emb_full da bi che 70%. Xem KIEN_TRUC_MODEL.md muc 7.
                                  #   false = quay lai duong cu (de A/B).
  band_norm: true                 # Chia he so QWT moi dai cho std rieng truoc khi vao
                                  #   Linear, nhan lai o recon head. Bien do chenh ~100 lan
                                  #   (L3 LL std 2.31 vs L1 HH std 0.024) va chi co MOT
                                  #   Linear dung chung, nen khong chuan hoa thi encoder
                                  #   khong nhin thay chi tiet min -> anh mo.
  token_patch_image: 16           # 8 -> 16: token anh 1024 -> 256. Truoc day 60% token nam
                                  #   o muc 1 (SNR ~0 dB) - dung thang bi nhieu vui nang nhat.
  cross_modal_masking: true

masking:
  protect_coarse:       true   # LUON giu dai tho (anh LL, imu A) trong context: khong bao
                               #   gio lam target, khong bao gio bi vut. Chi 36/512 token
                               #   nhung mang gan het do sang/bo cuc. Do thuc te: tat -> tran
                               #   PSNR chi 17.5 dB (thap hon ca anh nhieu 20.9 dB); bat ->
                               #   24.5 dB. Xem LOG_TRAIN_GIAI_THICH.md
  image_target_blocks:  4
  image_target_scale:   [0.15, 0.25]
  image_target_aspect:  [0.75, 1.5]
  imu_target_segments:  2
  imu_target_len:       [0.15, 0.25]
  context_keep_ratio:   0.5

train:
  epochs: 40                  # tran cung; early_stop thuong dung truoc muc nay
  batch_size: 8
  num_workers: 4
  limit_train_batches: 500    # 0 = full (~2600 batch/epoch). 500 * bs8 = 4000 sample/epoch
  limit_val_batches: 100      # 0 = full. Cat ngan eval cho nhanh
  eval_mask_seed: 1234        # seed mask khi eval; co dinh de cac epoch so sanh duoc voi nhau
  early_stop:
    metric: psnr              # L_jepa | psnr | rmse_acc | rmse_gyro (key trong val metrics)
                              #   KHONG dung L_jepa: no co the ve 0 bang representation
                              #   collapse, luc do best.pt se luu dung checkpoint hong.
    mode: max                 # min cho loss/rmse, max cho psnr
    patience: 6               # so epoch lien tiep khong cai thien -> dung. 0 = tat
    min_delta: 0.05           # dB. Cai thien nho hon nguong nay coi nhu khong cai thien
  optimizer: {name: adamw, lr: 1.5e-4, weight_decay: 0.05, warmup_steps: 500}
  ema: {start: 0.996, end: 1.0}
  loss:
    lambda_img: 1.0
    lambda_imu: 1.0
    lambda_band: 0.0          # TAT theo mac dinh. Loss tren he so QWT da chuan hoa, moi
                              #   dai trong so ngang nhau. Gia thuyet: L_img (mien pixel)
                              #   bi dai L3 LL nuot (94% nang luong / 4 token) nen model
                              #   khong co dong co tai tao chi tiet min.
                              #   DO A/B 1200 buoc, batch 32 -> GIA THUYET SAI:
                              #     goc          PSNR 11.10 dB | sai so dai L1 1.123
                              #     +band_norm   PSNR 11.49 dB | sai so dai L1 0.971
                              #     +ca L_band   PSNR 11.26 dB | sai so dai L1 0.980
                              #   Them L_band lam TE HON ca hai chi so. Giu lai lam nut
                              #   van de thu nghiem, nhung dung bat neu chua do lai.
    lambda_var: 1.0           # luc chong collapse (hinge kieu VICReg tren z_ctx).
                              #   0 = tat. Tang neu z_std van tut.
    var_gamma:  1.0           # nguong std THEO NOI DUNG (doi anh thi bieu dien doi bao
                              #   nhieu), do theo batch tai tung vi tri token. KHONG phai
                              #   std gop ca (batch, token): std gop co the dat ~1.0 chi
                              #   nho khac biet giua cac VI TRI token, trong khi doi anh
                              #   khong doi gi -> L_jepa ve 0 ma khong hoc duoc gi.
                              #   Do A/B 500 buoc: gamma 1.0 cho z_tgt noi dung 0.662 va
                              #   L_jepa/pos-only 0.20; gamma 0.5 chi cho 0.314 va 0.34.
                              #   => dung 1.0, dung ha xuong.
  amp: bf16
  grad_clip: 1.0
  log_every: 50
  ckpt_every: 1
